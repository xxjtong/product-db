[Service]
# 权限加固 drop-in（版本化于 R35）
#
# 安装位置：/etc/systemd/system/product-db.service.d/umask.conf
#   安装：sudo mkdir -p /etc/systemd/system/product-db.service.d
#         sudo cp deploy/systemd/product-db.service.d/umask.conf /etc/systemd/system/product-db.service.d/
#         sudo systemctl daemon-reload && sudo systemctl restart product-db
# 验证：systemctl show product-db -p UMask  → UMask=0077
#
# 应用以 tong 运行，其创建的文件默认走 umask 022 → 644（world-readable）。
# 该实例有 debian / lighthouse / tong 三个本地账号，DB 与日志因此对它们可读。
# 0077 让 SQLite 的 -wal/-shm、轮转日志、uploads 新文件一律 600/700。
# 注意：UMask 只影响**新建**文件，存量需一次性 chmod（见 DEPLOY.md 的「一次性加固」）。
UMask=0077
