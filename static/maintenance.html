<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品数据库 - 正在重启</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Noto Sans SC",sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{text-align:center;padding:48px;max-width:520px}
h1{color:#f1f5f9;font-size:28px;margin-bottom:12px}
p{color:#94a3b8;font-size:16px;line-height:1.6}
.badge{display:inline-block;margin-top:24px;padding:8px 20px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);border-radius:20px;color:#60a5fa;font-size:14px}
button{margin-top:16px;padding:8px 20px;background:#2563eb;border:0;border-radius:8px;color:#fff;font-size:14px;cursor:pointer}
.footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:16px;font-size:12px}
.footer a{color:#64748b;text-decoration:none}
.footer a:hover{color:#60a5fa}
</style>
</head>
<body>
<div class="card">
<h1>🔄 服务正在重启</h1>
<p>系统正在进行例行更新，约 10 秒后自动恢复，请稍后刷新本页。</p>
<button onclick="location.reload()">立即重试</button>
<div class="badge">product-db.cn</div>
</div>
<footer class="footer"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">陕ICP备2026015306号</a></footer>
<script>
// 每 5 秒自动探测一次，恢复后跳回首页
setInterval(function () {
  fetch('/product-db/api/health', { cache: 'no-store' })
    .then(function (r) { if (r.ok) location.href = '/product-db/' })
    .catch(function () {})
}, 5000)
</script>
</body>
</html>
